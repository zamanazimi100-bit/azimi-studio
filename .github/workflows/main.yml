name: Build AZIMI Guardian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 5

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android build components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          adb version

      - name: Build AZIMI Guardian debug APK
        run: gradle assembleDebug

      - name: Upload AZIMI Guardian APK
        uses: actions/upload-artifact@v4
        with:
          name: azimi-guardian-debug
          path: '**/build/outputs/apk/debug/*.apk'
