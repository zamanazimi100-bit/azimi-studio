name: Build AZIMI Guardian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android build components
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android build environment
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build AZIMI Guardian
        run: gradle assembleDebug --stacktrace

      - name: Upload AZIMI Guardian APK
        uses: actions/upload-artifact@v4
        with:
          name: azimi-guardian-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
